version: '3.8'

services:
  madasatec-app:
    # Usaremos a imagem do Node (ou a imagem final do seu build)
    image: node:18-alpine
    container_name: madasatec-app
    restart: unless-stopped
    # Mapeando a porta interna 3000. O Nginx depois vai apontar para 127.0.0.1:3000
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://madasatec:187.77.228.4mar@madasatec-db:5432/madasatec
      - N8N_WEBHOOK_URL=https://n8n.srv1841035.hstgr.cloud/webhook/projeto-m
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_USER=can23dopaulo@gmail.com
      - SMTP_PASSWORD=187.77.228.4mar
      - SESSION_SECRET=187.77.228.4mar
    # O comando abaixo é um placeholder para manter o container vivo caso ainda vá subir o código.
    # Quando tiver o package.json, substitua por: command: npm start
    command: tail -f /dev/null 
    working_dir: /app
    volumes:
      - ./:/app
    depends_on:
      madasatec-db:
        condition: service_healthy

  madasatec-db:
    image: postgres:16-alpine
    container_name: madasatec-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=madasatec
      - POSTGRES_USER=madasatec
      - POSTGRES_PASSWORD=187.77.228.4mar
    volumes:
      - madasatec_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madasatec -d madasatec"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  madasatec_postgres_data:
