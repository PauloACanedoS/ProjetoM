services:
  app:
    build: .
    container_name: madasatec-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 3000 --reload
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - madasatec_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.madasatec.rule=Host(`app.paulocanedosoftware.tech`)"
      - "traefik.http.routers.madasatec.entrypoints=web,websecure"
      - "traefik.http.services.madasatec.loadbalancer.server.port=3000"
