services:
  app:
    build: .
    container_name: madasatec-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Expõe a aplicação somente localmente por segurança
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - madasatec_net

  postgres:
    image: postgres:15-alpine
    container_name: madasatec-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - madasatec_net

volumes:
  pgdata:

networks:
  madasatec_net:
