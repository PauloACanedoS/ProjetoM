version: '3.8'

services:
  madasatec-app:
    # Usaremos a imagem do Node (ou a imagem final do seu build)
    image: node:18-alpine
    container_name: madasatec-app
    restart: unless-stopped
    # Mapeando a porta interna 3000. O Nginx depois vai apontar para 127.0.0.1:3000
    ports:
      - "127.0.0.1:3000:3000"
    # Arquivo .env (não comitar). Para produção, prefira Docker secrets ou um gerenciador de segredos.
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - DATABASE_URL=${DATABASE_URL}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
    # O comando abaixo é um placeholder para manter o container vivo caso ainda vá subir o código.
    # Quando tiver o package.json, substitua por: command: npm start
    command: tail -f /dev/null 
    working_dir: /app
    volumes:
      - ./:/app
    depends_on:
      madasatec-db:
        condition: service_healthy

  madasatec-db:
    image: postgres:16-alpine
    container_name: madasatec-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - madasatec_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  madasatec_postgres_data:
